# ============================================================================
# LOCKIN Self-Hosted LAN Production Stack
# Serves https://lockin.home.arpa via Caddy internal CA + PostgreSQL 17 + MinIO
#
#   docker compose -f infra/compose/docker-compose.prod.yml --env-file .env up -d
# ============================================================================
name: lockin-prod

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_URL: ${APP_URL:-https://lockin.home.arpa}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://lockin_app:${DB_APP_PASSWORD}@postgres:5432/${DB_NAME:-lockin}
      DATABASE_CMS_URL: postgres://lockin_cms:${DB_CMS_PASSWORD}@postgres:5432/${DB_NAME:-lockin}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-LOCKIN <no-reply@lockin.home.arpa>}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-lockin}
      TZ: Asia/Kolkata
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres-prod-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${DB_NAME:-lockin}"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: pgsty/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-lockin-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-prod-data:/data

volumes:
  caddy-data:
  caddy-config:
  postgres-prod-data:
  minio-prod-data:
